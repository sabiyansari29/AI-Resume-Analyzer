[build]
  base = "client"
  command = "npm install --include=dev && npm run build"
  publish = "dist"
  functions = "../netlify/functions"

[build.environment]
  NODE_ENV = "development"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false